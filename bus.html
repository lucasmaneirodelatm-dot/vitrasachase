<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bus</title>
<link rel="stylesheet" href="styles.css">
<script src="datos.js"></script>
</head>
<body>

<h1>🚌 Dentro del Bus</h1>
<div id="datos"></div>

<button class="btn" onclick="tocarTimbre()">🔔 Tocar timbre</button>

<script>
/* ===== AUDIO ===== */
const sonidoTimbre = new Audio("audio/timbre.mp3");
sonidoTimbre.preload = "auto";

/* ===== LÓGICA ===== */
const p = new URLSearchParams(window.location.search);
const busId = p.get("id");
const bus = BUSES[busId];

let reloj = 0;

if (!bus) {
  document.getElementById("datos").textContent = "Bus no encontrado";
  throw new Error("Bus no encontrado");
}

setInterval(() => {
  reloj++;
  actualizar();
}, 1000);

function actualizar(){
  const parada = paradaActual(bus, reloj);
  document.getElementById("datos").innerHTML = `
    <h2>Línea ${bus.linea}</h2>
    <p>Hora virtual: ${reloj}</p>
    <p>Próxima parada: ${parada}</p>
    <p>Hoja de ruta:</p>
    <ul>
      ${bus.ruta.map(r => `<li>${r}</li>`).join("")}
    </ul>
  `;
}

function tocarTimbre(){
  sonidoTimbre.currentTime = 0;
  sonidoTimbre.play();

  const destino = paradaActual(bus, reloj + 1);

  setTimeout(() => {
    location.href = "parada.html?id=" + destino;
  }, 500);
}

actualizar();
</script>
</body>
</html>
